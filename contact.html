<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>联系｜红军编织袋</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#F5F0E8;color:#1A1A1A;font-family:"Noto Serif SC","Source Han Serif",Georgia,"SimSun",serif;line-height:1.8;}
.sans{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;}
a{color:inherit;text-decoration:none;}
header{position:fixed;top:0;left:0;right:0;height:64px;background:rgba(245,240,232,.92);backdrop-filter:blur(8px);z-index:99;border-bottom:1px solid rgba(0,0,0,.06);}
.nav{max-width:1100px;margin:0 auto;height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 32px;}
.logo{font-size:15px;letter-spacing:3px;}
.logo span{color:#B54A3C;margin-left:4px;font-size:12px;}
.nav-links{display:flex;gap:36px;font-size:13px;color:#555;letter-spacing:1px;}
.wrap{max-width:800px;margin:120px auto;padding:0 32px;}
.eyebrow{font-size:12px;letter-spacing:6px;color:#888;text-align:center;margin-bottom:24px;}
h1{font-size:32px;letter-spacing:6px;text-align:center;font-weight:400;margin-bottom:60px;}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-bottom:60px;}
@media(max-width:768px){.cards{grid-template-columns:1fr;}}
.card{border:1px solid rgba(0,0,0,.08);padding:32px 20px;text-align:center;background:#FAF7F2;}
.card .icon{font-size:24px;margin-bottom:16px;}
.card h3{font-size:15px;letter-spacing:3px;font-weight:400;margin-bottom:12px;}
.card p{font-size:14px;color:#333;letter-spacing:1px;}
.card a{display:block;margin-top:8px;font-size:13px;color:#B54A3C;border-bottom:1px solid #B54A3C;padding-bottom:2px;display:inline-block;}
.addr{text-align:center;font-size:14px;letter-spacing:2px;line-height:2;color:#555;margin-bottom:40px;}
.addr strong{color:#1A1A1A;font-weight:400;}
.img-block{margin:40px 0;aspect-ratio:16/9;background:#E8E2D8;display:flex;align-items:center;justify-content:center;color:#B5AC9E;font-size:12px;letter-spacing:2px;overflow:hidden;}
.img-block img{width:100%;height:100%;object-fit:cover;}
.note{text-align:center;font-size:12px;color:#888;letter-spacing:2px;margin-top:40px;}
.back{text-align:center;margin:60px 0;font-size:13px;letter-spacing:3px;}
.back a{border-bottom:1px solid #1A1A1A;padding-bottom:4px;}
footer{border-top:1px solid rgba(0,0,0,.08);padding:40px 32px;margin-top:80px;}
.foot{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;font-size:11px;color:#999;letter-spacing:1px;}
@media(max-width:768px){.nav-links{display:none;}h1{font-size:24px;letter-spacing:4px;}}
</style>
</head>
<body>
<header>
  <div class="nav">
    <div class="logo">红军编织袋<span>·</span></div>
    <div class="nav-links sans">
      <a href="index.html">首页</a>
      <a href="about.html">关于</a>
      <a href="products.html">产品</a>
      <a href="contact.html">联系</a>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="eyebrow">联 系</div>
  <h1>到厂看货 · 随时欢迎</h1>
  
  <div class="cards sans">
    <div class="card">
      <div class="icon">📞</div>
      <h3>电话</h3>
      <p>137 3432 2272</p>
      <a href="tel:13734322272">拨打</a>
    </div>
    <div class="card">
      <div class="icon">💬</div>
      <h3>微信</h3>
      <p>zhangyanan911515</p>
      <a href="#" onclick="navigator.clipboard.writeText('zhangyanan911515')">复制</a>
    </div>
    <div class="card">
      <div class="icon">📍</div>
      <h3>到厂</h3>
      <p>莒县刘官庄<br>马驹岭村</p>
    </div>
  </div>
  
  <div class="addr">
    <strong>山东省日照市莒县刘官庄镇马驹岭村</strong><br>
    导航搜索「红军编织袋」或致电指引
  </div>
  
  <div class="img-block">
    <img src="images/contact.jpg" alt="店铺" onerror="this.style.display='none';this.parentElement.innerHTML='店铺实拍 · 后期上传 images/contact.jpg'">
  </div>
  
  <div class="note sans">打样快 · 起订灵活 · 批量交付稳定 · 支持来图定制</div>
  
  <div class="back"><a href="index.html">← 返回首页</a></div>
</div>

<footer>
  <div class="foot sans">
    <div>© 2026 红军编织袋专卖店 · 莒县刘官庄镇马驹岭村</div>
    <div>137 3432 2272</div>
  </div>
</footer>
</body>
</html>
