<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>联系我们 - 我的企业官网</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "Microsoft YaHei", sans-serif; color: #333; line-height: 1.6; }
header { background: #1a3a5c; color: white; padding: 1rem 0; }
.container { max-width: 1100px; margin: 0 auto; padding: 0 1rem; display: flex; justify-content: space-between; align-items: center; }

.contact-wrap { max-width: 800px; margin: 3rem auto; padding: 0 1rem; display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
.contact-info h3 { color: #1a3a5c; margin-bottom: 1.5rem; }
.contact-item { margin-bottom: 1.5rem; }
.label { font-weight: bold; color: #1a3a5c; }
.form-group { margin-bottom: 1rem; }
.form-group input, .form-group textarea { width: 100%; padding: 0.7rem; border: 1px solid #ddd; border-radius: 4px; }
.submit-btn { background: #ff6b35; color: white; border: none; padding: 0.8rem 2rem; border-radius: 4px; cursor: pointer; }
footer { background: #0d2438; color: #aaa; padding: 2rem 1rem; text-align: center; margin-top: 3rem; }
@media (max-width: 768px) { .contact-wrap { grid-template-columns: 1fr; } }

</head>
