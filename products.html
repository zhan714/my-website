<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品中心_红军编织袋专卖店_山东日照编织袋厂家</title>
<style>
  :root{
    --green:#2E5C3E;
    --light-green:#4A7A5B;
    --orange:#F4A261;
    --bg:#FDF6EC;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:#333;
    line-height:1.6;
  }
  /* 头部统一风格 */
  header{
    background:#fff;
    padding:20px 0;
    box-shadow:0 2px 10px rgba(46,92,62,0.08);
    position:sticky;
    top:0;
    z-index:100;
  }
  .header-inner{
    max-width:1200px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
  }
  .logo{
    font-family:"KaiTi","STKaiti","楷体",serif;
    font-size:32px;
    font-weight:900;
    color:var(--green);
    letter-spacing:2px;
    text-decoration:none;
  }
  nav a{
    margin-left:25px;
    color:#555;
    text-decoration:none;
    font-size:16px;
    transition:.3s;
  }
  nav a:hover, nav a.active{color:var(--green); font-weight:bold;}
  
  /* 页面标题 */
  .page-title{
    text-align:center;
    color:var(--green);
    font-size:32px;
    margin:40px 0 30px;
    letter-spacing:2px;
  }
  
  /* 核心：规整对称的网格布局（一行3个） */
  .container{max-width:1200px;margin:0 auto;padding:0 20px 60px;}
  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:30px;
  }
  
  /* 卡片样式 */
  .card{
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,0.05);
    transition:.3s;
    text-decoration:none;
    color:inherit;
    display:flex;
    flex-direction:column;
  }
  .card:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 25px rgba(46,92,62,0.15);
  }
  .img-box{
    height:240px;
    background:#f0f0f0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .img-box img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.5s;
  }
  .card:hover .img-box img{transform:scale(1.03);}
  
  .info{padding:20px;text-align:center;flex-grow:1;}
  .info h3{
    color:var(--green);
    font-size:20px;
    margin-bottom:8px;
  }
  .info p{
    color:#666;
    font-size:14px;
    line-height:1.5;
  }
  
  footer{
    background:var(--green);
    color:#fff;
    text-align:center;
    padding:30px 20px;
    margin-top:40px;
  }
  footer p{margin:5px 0;font-size:14px;}
  
  /* 响应式：平板一行2个，手机一行1个 */
  @media(max-width:992px){
    .grid{grid-template-columns:repeat(2, 1fr);}
  }
  @media(max-width:600px){
    .grid{grid-template-columns:1fr;}
    .header-inner{flex-direction:column;gap:15px;}
    nav a{margin:0 10px;}
    .logo{font-size:26px;}
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <a href="index.html" class="logo">红军编织袋专卖店</a>
    <nav>
      <a href="index.html">首页</a>
      <a href="about.html">关于我们</a>
      <a href="products.html" class="active">产品中心</a>
      <a href="contact.html">联系我们</a>
    </nav>
  </div>
</header>

<div class="container">
  <h1 class="page-title">产品中心</h1>
  <div class="grid" id="prod-grid">
    <p style="text-align:center;color:#888;grid-column:1/-1;">加载中...</p>
  </div>
</div>

<footer>
  <p>电话：13734322272　|　微信：zhangyanan911515</p>
  <p>地址：山东省日照市莒县刘官庄镇马驹岭村</p>
  <p>红军编织袋专卖店 | 客户需要什么，我们就做什么</p>
</footer>

<script>
fetch('products.json').then(r=>r.json()).then(data=>{
  var grid=document.getElementById('prod-grid');
  grid.innerHTML='';
  data.forEach(p=>{
    var id=p.folder.split('/')[1];
    var imgSrc=(p.imgs&&p.imgs[0])||(p.folder+'/1.png');
    var card=document.createElement('a');
    card.className='card';
    card.href='detail.html?id='+id;
    card.innerHTML=`
      <div class="img-box">
        <img src="${imgSrc}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/400x300?text=图片加载中'">
      </div>
      <div class="info">
        <h3>${p.name}</h3>
        <p>${p.desc}</p>
      </div>`;
    grid.appendChild(card);
  });
}).catch(()=>{
  document.getElementById('prod-grid').innerHTML='<p style="color:red;text-align:center;grid-column:1/-1;">产品数据加载失败，请检查 products.json</p>';
});
</script>
</body>
</html>
