<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品中心 - 红军编织袋专卖店</title>
<style>
  :root{--green:#2E5C3E;--green-dark:#234530;--orange:#D97706;--bg:#F8F7F2;--card:#FFFDF8;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:#333;line-height:1.6;}
  a{text-decoration:none;color:inherit;}
  img{max-width:100%;display:block;}

  .container{width:100%;max-width:1200px;margin:0 auto;padding:0 20px;}

  /* ===== 统一导航 ===== */
  header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);border-bottom:1px solid #eee;}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:70px;}
  .logo{display:flex;align-items:center;gap:8px;color:var(--green);}
  .logo-icon{width:34px;height:34px;background:var(--green);color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:bold;}
  .logo-text{font-size:20px;font-weight:700;letter-spacing:1px;}
  .nav-right{display:flex;align-items:center;gap:24px;}
  nav{display:flex;gap:24px;font-size:15px;}
  nav a{color:#444;transition:.2s;font-weight:500;}
  nav a:hover,nav a.active{color:var(--orange);}
  /* 返回产品中心按钮 */
  .back-prod{display:inline-flex;align-items:center;gap:6px;background:var(--green);color:#fff;padding:8px 16px;border-radius:20px;font-size:13.5px;font-weight:600;transition:.25s;white-space:nowrap;}
  .back-prod:hover{background:var(--orange);transform:translateX(-2px);}
  .header-tel{background:var(--orange);color:#fff;padding:8px 18px;border-radius:20px;font-size:14px;font-weight:bold;white-space:nowrap;}
  .header-tel:hover{background:var(--green);}

  /* 面包屑 */
  .breadcrumb{background:var(--green);color:#fff;padding:14px 0;font-size:14px;}
  .breadcrumb a{color:rgba(255,255,255,0.8);}
  .breadcrumb a:hover{color:#fff;}

  /* 页面标题 */
  .page-hero{background:linear-gradient(135deg,#EAF1EC,#F8F7F2);padding:50px 0;text-align:center;}
  .page-hero h1{font-size:38px;color:var(--green);margin-bottom:10px;}
  .page-hero p{color:#666;font-size:16px;}

  /* 分类筛选 */
  .filter{padding:24px 0 8px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .filter button{background:#fff;color:var(--green);border:1.5px solid #ddd;padding:8px 22px;border-radius:24px;font-size:14px;font-weight:600;cursor:pointer;transition:.25s;}
  .filter button:hover,.filter button.active{border-color:var(--green);background:var(--green);color:#fff;}

  /* 产品网格 */
  .products{padding:30px 0 80px;}
  .prod-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:26px;}
  .prod{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,0.03);transition:.3s;display:flex;flex-direction:column;}
  .prod:hover{box-shadow:0 12px 30px rgba(0,0,0,0.1);transform:translateY(-4px);}
  .prod-img{height:240px;background:#f0f0f0;overflow:hidden;position:relative;}
  .prod-img img{width:100%;height:100%;object-fit:cover;transition:.5s;}
  .prod:hover .prod-img img{transform:scale(1.06);}
  .prod-cat{position:absolute;top:12px;left:12px;background:rgba(46,92,62,0.9);color:#fff;padding:4px 12px;border-radius:14px;font-size:12px;font-weight:600;}
  .prod-info{padding:20px;flex:1;display:flex;flex-direction:column;}
  .prod-info h3{font-size:19px;color:var(--green);margin-bottom:8px;}
  .prod-info p{color:#666;font-size:14px;margin-bottom:16px;flex:1;}
  .prod-info .more{color:var(--green);font-size:14px;font-weight:700;}

  /* 悬浮返回按钮（移动端常驻） */
  .float-back{position:fixed;right:18px;bottom:24px;z-index:300;width:52px;height:52px;border-radius:50%;background:var(--green);color:#fff;display:none;align-items:center;justify-content:center;font-size:20px;box-shadow:0 6px 20px rgba(46,92,62,0.4);border:none;cursor:pointer;}

  /* 页脚 */
  footer{background:var(--green-dark);color:#ccc;padding:56px 0 24px;font-size:14px;}
  .foot-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.2fr;gap:40px;margin-bottom:40px;}
  .foot-brand .logo-text{color:#fff;}
  .foot-brand p{margin-top:16px;line-height:1.8;color:#aaa;}
  .foot-col h4{color:#fff;margin-bottom:20px;font-size:16px;}
  .foot-col a{display:block;margin-bottom:12px;color:#aaa;transition:.2s;}
  .foot-col a:hover{color:var(--orange);}
  .foot-contact p{margin-bottom:12px;color:#aaa;}
  .foot-contact strong{color:#fff;}
  .copyright{text-align:center;border-top:1px solid #3a5a4a;padding-top:22px;color:#888;font-size:13px;}

  @media(max-width:900px){
    .prod-grid{grid-template-columns:repeat(2, 1fr);}
    .float-back{display:flex;}
    .foot-grid{grid-template-columns:1fr 1fr;gap:30px;}
  }
  @media(max-width:560px){
    .prod-grid{grid-template-columns:1fr;}
    .foot-grid{grid-template-columns:1fr;}
    .header-tel,.back-prod{display:none;}
    nav{display:none;}
    .nav-inner{justify-content:center;}
  }
</style>
</head>
<body>

<header>
  <div class="container nav-inner">
    <a href="index.html" class="logo">
      <div class="logo-icon">红</div>
      <div class="logo-text">军编织袋专卖店</div>
    </a>
    <div class="nav-right">
      <a href="products.html" class="back-prod">← 产品中心</a>
      <nav>
        <a href="index.html">首页</a>
        <a href="about.html">关于我们</a>
        <a href="products.html" class="active">产品中心</a>
        <a href="contact.html">联系我们</a>
      </nav>
      <a href="tel:13734322272" class="header-tel">📞 13734322272</a>
    </div>
  </div>
</header>

<div class="breadcrumb">
  <div class="container"><a href="index.html">首页</a> / 产品中心</div>
</div>

<div class="page-hero">
  <div class="container">
    <h1>产品中心</h1>
    <p>多品类包装袋，源头工厂直供，支持按需定制印刷</p>
  </div>
</div>

<div class="container">
  <div class="filter" id="filter">
    <button class="active" onclick="filterProd('all',this)">全部</button>
    <button onclick="filterProd('普通编织袋',this)">普通编织袋</button>
    <button onclick="filterProd('彩印编织袋',this)">彩印编织袋</button>
    <button onclick="filterProd('复合编织袋',this)">复合编织袋</button>
    <button onclick="filterProd('粮食包装',this)">粮食包装</button>
    <button onclick="filterProd('饲料化肥',this)">饲料化肥</button>
  </div>

  <div class="products">
    <div class="prod-grid" id="prod-grid"></div>
  </div>
</div>

<button class="float-back" onclick="location.href='products.html'">🛍</button>

<footer>
  <div class="container">
    <div class="foot-grid">
      <div class="foot-brand">
        <a href="index.html" class="logo">
          <div class="logo-icon">红</div>
          <div class="logo-text">军编织袋专卖店</div>
        </a>
        <p>山东日照莒县源头工厂，主营普通、彩印、复合编织袋及粮食饲料包装袋，支持按需定制印刷。</p>
      </div>
      <div class="foot-col">
        <h4>快速导航</h4>
        <a href="index.html">首页</a><a href="about.html">关于我们</a>
        <a href="products.html">产品中心</a><a href="contact.html">联系我们</a>
      </div>
      <div class="foot-col">
        <h4>主营产品</h4>
        <a href="products.html">普通编织袋</a><a href="products.html">彩印编织袋</a>
        <a href="products.html">复合编织袋</a><a href="products.html">粮食饲料袋</a>
      </div>
      <div class="foot-contact">
        <h4>联系方式</h4>
        <p><strong>电话：</strong>13734322272</p>
        <p><strong>微信：</strong>zhangyanan911515</p>
        <p><strong>地址：</strong>山东省日照市莒县刘官庄镇马驹岭村</p>
      </div>
    </div>
    <div class="copyright">© 2026 红军编织袋专卖店 | 源头工厂 · 定制印刷 · 交期稳定</div>
  </div>
</footer>

<script>
function filterProd(cat,btn){
  document.querySelectorAll('#filter button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render(cat);
}
function render(cat){
  fetch('products.json').then(r=>r.json()).then(data=>{
    let grid=document.getElementById('prod-grid');
    let list=cat==='all'?data:data.filter(p=>(p.cat||'').includes(cat));
    grid.innerHTML=list.map(p=>{
      let img=(p.imgs&&p.imgs[0])||(p.folder+'/1.png');
      return `<a href="detail.html?id=${p.folder.split('/')[1]}" class="prod">
        <div class="prod-img">
          <span class="prod-cat">${p.cat||'产品'}</span>
          <img src="${img}" onerror="this.src='https://via.placeholder.com/400x300?text=产品图'">
        </div>
        <div class="prod-info">
          <h3>${p.name}</h3><p>${p.desc}</p>
          <span class="more">查看详情 →</span>
        </div></a>`;
    }).join('');
  });
}
render('all');
</script>
</body>
</html>
