header{background:#fff;border-bottom:1px solid #ECECEC;position:sticky;top:0;z-index:100;}

footer{background:#F4F1E8;padding:40px 24px 24px;}

.info h4,.links h4{font-size:15px;margin-bottom:8px;}

.copy{max-width:1100px;margin:0 auto;padding-top:20px;border-top:1px solid #DDD;font-size:12.5px;color:#999;text-align:center;}
#lb{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:999;flex-direction:column;}
#lb.on{display:flex;}
#lb-img{max-width:90%;max-height:80%;border-radius:4px;}
#lb-cap{color:#fff;margin-top:12px;font-size:14px;}
#lb .nav-btn{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:40px;cursor:pointer;padding:20px;user-select:none;}
#lb .prev{left:20px;} #lb .next{right:20px;}
@media(max-width:768px){.grid{grid-template-columns:repeat(2,1fr);}.nav a{margin-left:16px;}}

  <img id="lb-img" src="" alt="">
  <div id="lb-cap"></div>
  <div class="nav-btn next" onclick="stepLb(1)">›</div>
</div>

<script>
const sections=[
  {id:"putong", name:"普通编织袋", desc:"承重强、性价比高，日常通用首选", range:[1,8]},
  {id:"caiyin", name:"彩印编织袋", desc:"精美印刷，提升品牌形象", range:[1,8]},
  {id:"fuhe",   name:"复合与粮食饲料袋", desc:"防潮防漏，包含复合/大米/面粉/饲料等", range:[1,12]},
];
const ext=".jpg"; 

let allImgs=[];
function build(){
  const box=document.getElementById('sections');
  let html="";
  sections.forEach((s,si)=>{
    let figs="";
    for(let i=s.range[0];i<=s.range[1];i++){
      const src=`images/${s.id}/${i}${ext}`;
      figs+=`<figure onclick='openLb(${allImgs.length})'>
        <div class="pic"><img src="${src}" alt="${s.name} ${i}" onerror="this.parentNode.style.display='none'"></div>
        <figcaption>${s.name}</figcaption></figure>`;
      allImgs.push({src:src, cap:`${s.name} (第${i}款)`});
    }
    html+=`<div class="section" style="margin-top:40px;">
      <div class="section-head"><span style="color:#3A6B4A;margin-right:8px;">0${si+1}</span><h2 style="display:inline;">${s.name}</h2><span class="desc">${s.desc}</span></div>
      <div class="grid">${figs}</div>
    </div>`;
  });
  box.innerHTML=html;
}

let cur=0;
function openLb(i){cur=i;document.getElementById('lb').classList.add('on');document.getElementById('lb-img').src=allImgs[i].src;document.getElementById('lb-cap').textContent=allImgs[i].cap;}
function stepLb(d){cur=(cur+d+allImgs.length)%allImgs.length;document.getElementById('lb-img').src=allImgs[cur].src;document.getElementById('lb-cap').textContent=allImgs[cur].cap;}
document.getElementById('lb').addEventListener('click',e=>{if(e.target.id==='lb')document.getElementById('lb').classList.remove('on');});
document.addEventListener('keydown',e=>{
  if(!document.getElementById('lb').classList.contains('on'))return;
  if(e.key==='Escape')document.getElementById('lb').classList.remove('on');
  if(e.key==='ArrowLeft')stepLb(-1);
  if(e.key==='ArrowRight')stepLb(1);
});
build();
</script>
