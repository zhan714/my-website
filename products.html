<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品中心 - 红军编织袋专卖店</title>
<style>
:root{--green:#2b5e3b;--light:#f5f7f0;--orange:#d97706;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Microsoft YaHei",sans-serif;background:var(--light);color:#333;}
a{text-decoration:none;color:inherit;}
.container{max-width:1200px;margin:0 auto;padding:0 20px;}

/* 头部 */
header{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08);position:sticky;top:0;z-index:100;}
.head-top{display:flex;align-items:center;justify-content:space-between;padding:15px 0;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-icon{background:var(--green);color:#fff;width:42px;height:42px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;}
.logo-text{font-size:24px;font-weight:bold;color:var(--green);}
.nav-right{display:flex;align-items:center;gap:25px;}
nav{display:flex;gap:25px;}
nav a{color:#333;font-size:16px;transition:.3s;}
nav a:hover,nav a.active{color:var(--orange);}
.header-tel{background:var(--orange);color:#fff;padding:10px 20px;border-radius:30px;font-weight:bold;}

/* 面包屑 */
.breadcrumb{background:var(--green);color:#fff;padding:12px 0;font-size:15px;}
.breadcrumb a{color:#fff;opacity:.8;}
.breadcrumb span{margin:0 8px;}

/* 标题 */
.section-title{text-align:center;font-size:36px;color:var(--green);margin:40px 0 15px;}
.section-sub{text-align:center;color:#666;font-size:16px;margin-bottom:30px;}

/* 产品网格 */
#prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:25px;margin-bottom:50px;}
.prod{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.05);transition:.3s;}
.prod:hover{transform:translateY(-5px);box-shadow:0 8px 25px rgba(0,0,0,.1);}
.prod-img{position:relative;height:220px;background:#eee;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.prod-img img{width:100%;height:100%;object-fit:cover;}
.prod-cat{position:absolute;top:12px;left:12px;background:var(--orange);color:#fff;padding:4px 10px;border-radius:4px;font-size:12px;}
.prod-info{padding:18px;}
.prod-info h3{color:var(--green);font-size:20px;margin-bottom:8px;}
.prod-info p{color:#666;font-size:14px;margin-bottom:12px;}
.more{color:var(--orange);font-size:14px;}

/* 悬浮返回 */
.float-back{position:fixed;bottom:30px;right:30px;width:50px;height:50px;background:var(--green);color:#fff;border:none;border-radius:50%;font-size:22px;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,.2);z-index:99;}

@media(max-width:768px){
  .nav-right nav{display:none;}
  .head-top{flex-wrap:wrap;}
  #prod-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<header>
  <div class="container head-top">
    <a href="index.html" class="logo">
      <div class="logo-icon">红</div>
      <div class="logo-text">军编织袋专卖店</div>
    </a>
    <div class="nav-right">
      <nav>
        <a href="index.html">首页</a>
        <a href="about.html">关于我们</a>
        <a href="products.html" class="active">产品中心</a>
        <a href="contact.html">联系我们</a>
      </nav>
      <a href="tel:13734322272" class="header-tel">📞 13734322272</a>
    </div>
  </div>
</header>

<div class="breadcrumb">
  <div class="container">
    <a href="index.html">首页</a><span>/</span><a href="products.html">产品中心</a>
  </div>
</div>

<div class="container">
  <h1 class="section-title">产品中心</h1>
  <p class="section-sub">多品类包装袋，源头工厂直供，支持按需定制印刷</p>
  
  <div id="prod-grid"></div>
</div>

<button class="float-back" onclick="location.href='products.html'">🛍</button>

<footer>
  <div class="container">
    <div class="foot-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:30px;padding:40px 0;">
      <div class="foot-brand">
        <a href="index.html" class="logo"><div class="logo-icon">红</div><div class="logo-text">军编织袋专卖店</div></a>
        <p style="margin-top:15px;color:#ccc;font-size:14px;">山东日照莒县源头工厂，主营普通、彩印、复合编织袋及粮食饲料包装袋，支持按需定制印刷。</p>
      </div>
      <div class="foot-col">
        <h4 style="color:#fff;margin-bottom:15px;">快速导航</h4>
        <a href="index.html" style="display:block;color:#ccc;margin:8px 0;">首页</a>
        <a href="about.html" style="display:block;color:#ccc;margin:8px 0;">关于我们</a>
        <a href="products.html" style="display:block;color:#ccc;margin:8px 0;">产品中心</a>
        <a href="contact.html" style="display:block;color:#ccc;margin:8px 0;">联系我们</a>
      </div>
      <div class="foot-col">
        <h4 style="color:#fff;margin-bottom:15px;">主营产品</h4>
        <a href="products.html" style="display:block;color:#ccc;margin:8px 0;">普通编织袋</a>
        <a href="products.html" style="display:block;color:#ccc;margin:8px 0;">彩印编织袋</a>
        <a href="products.html" style="display:block;color:#ccc;margin:8px 0;">复合编织袋</a>
        <a href="products.html" style="display:block;color:#ccc;margin:8px 0;">粮食饲料袋</a>
      </div>
      <div class="foot-contact">
        <h4 style="color:#fff;margin-bottom:15px;">联系方式</h4>
        <p style="color:#ccc;margin:8px 0;"><strong style="color:#fff;">电话：</strong>13734322272</p>
        <p style="color:#ccc;margin:8px 0;"><strong style="color:#fff;">微信：</strong>zhangyanan911515</p>
        <p style="color:#ccc;margin:8px 0;"><strong style="color:#fff;">地址：</strong>山东省日照市莒县刘官庄镇马驹岭村</p>
      </div>
    </div>
    <div class="copyright" style="text-align:center;color:#999;padding:20px 0;border-top:1px solid #444;">© 2026 红军编织袋专卖店 | 源头工厂 · 定制印刷 · 交期稳定</div>
  </div>
</footer>

<script>
// 直接全部展示，不做分类筛选
fetch('products.json').then(r=>r.json()).then(data=>{
  let grid=document.getElementById('prod-grid');
  grid.innerHTML=data.map(p=>{
    let img=(p.imgs&&p.imgs[0])||(p.folder+'/1.png');
    return `<a href="detail.html?id=${p.folder.split('/')[1]}" class="prod">
      <div class="prod-img">
        <span class="prod-cat">${p.cat||'产品'}</span>
        <img src="${img}" onerror="this.src='https://via.placeholder.com/400x300?text=产品图'">
      </div>
      <div class="prod-info">
        <h3>${p.name}</h3><p>${p.desc}</p>
        <span class="more">查看详情 →</span>
      </div></a>`;
  }).join('');
}).catch(()=>{
  document.getElementById('prod-grid').innerHTML='<p style="text-align:center;color:#999;grid-column:1/-1;">产品加载中…</p>';
});
</script>
</body>
</html>
